services:
  # Main R Best Practices API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: r-practices-api
    ports:
      # Loopback only: clients reach the API through nginx. Publishing it on all interfaces would let a
      # client skip the proxy and spoof X-Forwarded-For.
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LOG_LEVEL=info
      # nginx (below) sits in front of this service and sets X-Forwarded-For, so trust exactly one hop.
      - TRUST_PROXY=1
      # Optional settings (defaults shown by `GET /api/config`); uncomment to change:
      # Directories the server may analyse (comma separated). Default in production: /projects
      # - ALLOWED_PROJECT_ROOTS=/projects
      # Bearer token that protects /metrics* (without it, /metrics* answer 404 in production)
      # - METRICS_TOKEN=change-me
      # Maximum JSON/form request body in bytes (default 1048576)
      # - MAX_BODY_BYTES=1048576
    volumes:
      # Mount user's project directory for validation
      # Adjust path as needed for your projects
      - /projects:/projects:ro
    restart: unless-stopped
    deploy:
      # Resource limits and reservations
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Enable container statistics tracking
    labels:
      com.example.monitoring: "true"
      com.example.service: "r-best-practices-mcp"

  # Optional: Nginx reverse proxy for SSL/production deployment
  nginx:
    image: nginx:alpine
    container_name: r-practices-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Uncomment for SSL certificates
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      # Resource limits and reservations
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    labels:
      com.example.monitoring: "true"
      com.example.service: "nginx-proxy"
    profiles:
      - with-proxy

volumes:
  # Optional: persistent data volume if needed
  api-data:
