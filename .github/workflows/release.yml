name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build TypeScript
        run: npm run build

      - name: Create tarball
        run: |
          mkdir -p release
          tar -czf release/r-best-practices-mcp-${{ github.ref_name }}.tar.gz \
            dist/ \
            package.json \
            package-lock.json \
            README.md \
            LICENSE
          ls -lh release/

      - name: Create zip archive
        run: |
          zip -r release/r-best-practices-mcp-${{ github.ref_name }}.zip \
            dist/ \
            package.json \
            package-lock.json \
            README.md \
            LICENSE

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: release-artifacts
          path: release/

  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous tag
        id: prev_tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "Previous tag: $PREV_TAG"

      - name: Generate changelog
        id: changelog
        run: |
          {
            echo "changelog<<EOF"
            if [ -z "${{ steps.prev_tag.outputs.prev_tag }}" ]; then
              echo "## Release ${{ github.ref_name }}"
              echo ""
              echo "Initial release"
              echo ""
              git log --pretty=format:"- %h: %s (%an)" | head -20
            else
              echo "## Release ${{ github.ref_name }}"
              echo ""
              echo "### Changes since ${{ steps.prev_tag.outputs.prev_tag }}"
              echo ""
              git log ${{ steps.prev_tag.outputs.prev_tag }}..HEAD --pretty=format:"- %h: %s (%an)"
            fi
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Display changelog
        run: echo "${{ steps.changelog.outputs.changelog }}"

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, changelog]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          name: release-artifacts

      - name: Get previous tag
        id: prev_tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release_notes
        run: |
          {
            echo "notes<<EOF"
            echo "# R Best Practices MCP Server - ${{ github.ref_name }}"
            echo ""
            echo "## What's New"
            echo ""
            if [ -z "${{ steps.prev_tag.outputs.prev_tag }}" ]; then
              echo "Initial release of the R Best Practices MCP Server"
              echo ""
              echo "### Features"
              echo "- Workflow detection for 9 R development workflows"
              echo "- Validation against 52+ best practices"
              echo "- Template generation for scaffolding projects"
              echo "- Knowledge base with comprehensive documentation"
              echo ""
              echo "### Supported Workflows"
              echo "- R Scripts"
              echo "- Quarto Documents"
              echo "- Shiny Applications"
              echo "- R Packages"
              echo "- R Markdown"
              echo "- renv Projects"
              echo "- targets Pipelines"
              echo "- Plumber APIs"
              echo "- Analysis Projects"
            else
              echo "### Commits since ${{ steps.prev_tag.outputs.prev_tag }}"
              echo ""
              git log ${{ steps.prev_tag.outputs.prev_tag }}..HEAD --pretty=format:"- **%s** (%an) [%h]"
            fi
            echo ""
            echo "## Installation"
            echo ""
            echo "### NPM"
            echo "\`\`\`bash"
            echo "npm install -g r-best-practices-mcp"
            echo "\`\`\`"
            echo ""
            echo "### Docker"
            echo "\`\`\`bash"
            echo "docker pull ghcr.io/alexseymer/r-best-practices-mcp:${{ github.ref_name }}"
            echo "\`\`\`"
            echo ""
            echo "### Manual"
            echo "Download the tarball or zip archive below and extract it."
            echo ""
            echo "## Artifacts"
            echo "- \`r-best-practices-mcp-${{ github.ref_name }}.tar.gz\` - Gzipped tarball"
            echo "- \`r-best-practices-mcp-${{ github.ref_name }}.zip\` - ZIP archive"
            echo ""
            echo "## Documentation"
            echo "- [README](https://github.com/alexseymer/r-best-practice-mcp/blob/main/README.md)"
            echo "- [Contributing Guide](https://github.com/alexseymer/r-best-practice-mcp/blob/main/CONTRIBUTING.md)"
            echo "- [Docker Guide](https://github.com/alexseymer/r-best-practice-mcp/blob/main/DOCKER.md)"
            echo ""
            echo "## System Requirements"
            echo "- Node.js >= 20.0.0"
            echo "- npm >= 10.0.0"
            echo "- Docker >= 20.0.0 (for containerized deployment)"
            echo ""
            echo "---"
            echo "Generated automatically via GitHub Actions"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            r-best-practices-mcp-${{ github.ref_name }}.tar.gz
            r-best-practices-mcp-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-publish:
    name: Build & Tag Docker Image
    runs-on: ubuntu-latest
    needs: create-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${{ github.ref_name }}
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: |
            r-best-practices-mcp:${{ steps.version.outputs.version }}
            r-best-practices-mcp:latest
          cache-from: type=gha

      - name: Test Docker image
        run: |
          docker run --rm \
            --name test-release \
            -d \
            -p 3000:3000 \
            r-best-practices-mcp:${{ steps.version.outputs.version }}

          sleep 5

          curl -f http://localhost:3000/health || exit 1
          echo "✓ Docker image test passed"

          docker stop test-release || true

      - name: Display Docker image info
        run: |
          echo "Docker image built successfully"
          echo "Tags: r-best-practices-mcp:${{ steps.version.outputs.version }}, r-best-practices-mcp:latest"
          echo ""
          echo "To push to a registry, use:"
          echo "  docker tag r-best-practices-mcp:${{ steps.version.outputs.version }} your-registry/r-best-practices-mcp:${{ steps.version.outputs.version }}"
          echo "  docker push your-registry/r-best-practices-mcp:${{ steps.version.outputs.version }}"
