name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test

      - name: Verify output
        run: test -f dist/index.js && echo "Build successful"

  publish-npm:
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-docker:
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/r-best-practices-mcp:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/r-best-practices-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Docker image to GitHub Packages
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/r-best-practices-mcp:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/r-best-practices-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    needs: [publish-npm, publish-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release_notes
        run: |
          # Extract version info
          VERSION=${{ steps.version.outputs.version }}

          # Create release notes
          cat > /tmp/release_notes.md << 'EOF'
          ## 📦 Release v${{ steps.version.outputs.version }}

          ### Published to

          - **npm**: https://www.npmjs.com/package/r-best-practices-mcp
          - **Docker Hub**: https://hub.docker.com/r/${{ secrets.DOCKERHUB_USERNAME }}/r-best-practices-mcp
          - **GitHub Packages**: https://github.com/${{ github.repository }}/pkgs/container/r-best-practices-mcp

          ### Installation

          ```bash
          # npm
          npm install r-best-practices-mcp

          # Docker
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/r-best-practices-mcp:${{ steps.version.outputs.version }}
          ```

          ### What's Changed

          See the [commit log](https://github.com/${{ github.repository }}/commits/${{ github.ref }}) for details.
          EOF

          echo "release_notes=$(cat /tmp/release_notes.md)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          name: Release v${{ steps.version.outputs.version }}
          body: |
            ## 📦 Release v${{ steps.version.outputs.version }}

            ### Published to

            - **npm**: https://www.npmjs.com/package/r-best-practices-mcp
            - **Docker Hub**: https://hub.docker.com/r/${{ secrets.DOCKERHUB_USERNAME }}/r-best-practices-mcp
            - **GitHub Packages**: https://github.com/${{ github.repository }}/pkgs/container/r-best-practices-mcp

            ### Installation

            ```bash
            # npm
            npm install r-best-practices-mcp@${{ steps.version.outputs.version }}

            # Docker
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/r-best-practices-mcp:${{ steps.version.outputs.version }}
            docker pull ghcr.io/${{ github.repository_owner }}/r-best-practices-mcp:${{ steps.version.outputs.version }}
            ```

            ### What's Changed

            See the [commit log](https://github.com/${{ github.repository }}/commits/${{ github.ref }}) for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
