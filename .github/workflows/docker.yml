name: Docker Build & Test

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop, 'claude/**']

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: |
            r-best-practices-mcp:latest
            r-best-practices-mcp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image (MCP over stdio)
        run: |
          REQ='{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
          OUT=$(echo "$REQ" | docker run -i --rm r-best-practices-mcp:latest || true)
          echo "$OUT" | head -c 300; echo
          if echo "$OUT" | grep -q '"detect_workflow"'; then
            echo "✓ MCP tools/list answered"
          else
            echo "✗ MCP server did not list its tools"; exit 1
          fi

      - name: Verify image layers
        run: |
          docker history r-best-practices-mcp:latest

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: r-best-practices-mcp:scan
          cache-from: type=gha

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'r-best-practices-mcp:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

