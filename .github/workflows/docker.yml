name: Docker Build & Test

on:
  push:
    branches: [main, develop, claude/development-assistance-e1oir2]
  pull_request:
    branches: [main, develop, claude/development-assistance-e1oir2]

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: |
            r-best-practices-mcp:latest
            r-best-practices-mcp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          # Create a test container
          docker run --rm \
            --name test-mcp \
            -d \
            -p 3000:3000 \
            r-best-practices-mcp:latest

          # Wait for server to start
          echo "Waiting for server to start..."
          sleep 5

          # Check health endpoint
          HEALTH_STATUS=$(curl -s http://localhost:3000/health || echo "FAILED")
          echo "Health check response: $HEALTH_STATUS"

          # Kill the test container
          docker stop test-mcp || true

          # Verify health check passed
          if [[ "$HEALTH_STATUS" == *"ok"* ]] || [[ "$HEALTH_STATUS" == *"healthy"* ]]; then
            echo "✓ Docker container health check passed"
            exit 0
          else
            echo "✗ Docker container health check failed"
            exit 1
          fi

      - name: Verify image layers
        run: |
          docker history r-best-practices-mcp:latest

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: r-best-practices-mcp:scan
          cache-from: type=gha

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'r-best-practices-mcp:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  compose-test:
    name: Docker Compose Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start services with docker-compose
        run: |
          # Build and start services
          docker-compose build
          docker-compose up -d

          # Wait for services to be ready
          echo "Waiting for services to start..."
          sleep 10

          # Check if MCP server is responding
          curl -f http://localhost:3000/health || exit 1
          echo "✓ MCP server is responding"

          # Stop services
          docker-compose down

      - name: Clean up
        if: always()
        run: docker-compose down -v
