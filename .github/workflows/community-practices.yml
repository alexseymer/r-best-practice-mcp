name: Community practices

# Two jobs, neither of which runs code from a pull request with write access:
#  - label:   pull_request_target only reads the PR's file names and labels it.
#  - gate:    checks out main and decides whether labelled PRs can merge.
# The contribution itself is checked by the normal test workflow on the PR (read-only token).

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    paths: ['src/data/practices/**']
  pull_request_review:
    types: [submitted, dismissed, edited]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number to evaluate (empty = all labelled PRs)'
        required: false

concurrency:
  group: community-practice-gate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  label:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Label practice-only PRs
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number, per_page: 100,
            });
            const practiceOnly = files.length > 0 &&
              files.every((f) => /^src\/data\/practices\/(?!index\.ts$)[a-z-]+\.ts$/.test(f.filename));
            if (practiceOnly) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number,
                labels: ['community-practice'],
              });
            }
            core.info(practiceOnly ? 'Labelled community-practice' : 'Not a practice-only PR; not labelled');

  gate:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: Checkout the base branch (never the pull request)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install and build (base branch code only)
        run: |
          npm ci
          npx tsc

      - name: Evaluate and merge eligible practice PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRACTICE_AUTOMERGE: ${{ vars.PRACTICE_AUTOMERGE }}
          PR_NUMBER: ${{ github.event.inputs.pr || (github.event_name == 'pull_request_review' && github.event.pull_request.number) || '' }}
        run: node scripts/community-practice-gate.mjs
